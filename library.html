<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="library.js" defer></script>
    <link rel="stylesheet" href="library.css">
    <title>Library</title>
</head>
<body>

    
    
    <h1>Library</h1>


    <div class="container">
        <dialog>
            
            <div class="modal">
                <h2>Add New Book</h2>
                <form method="modal">
                    <div class="input-container">
                        <label for="title">Title</label>
                        <input id="title" type="text">
                    </div>
                    <div class="input-container">
                        <label for="author">Author</label>
                        <input id="author" type="text">
                    </div>
                    <div class="input-container">
                        <label for="price">Price</label>
                        <input id="price" type="number">
                    </div>
                    <div class="input-container">
                        <label for="genre">Genre</label>
                        <select name="Genre" id="genre">
                            <option value="Fantasy">Fantasy</option>
                            <option value="Adventure">Adventure</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Horror">Horror</option>
                        </select>
                    </div>
                    <div class="input-container">
                        <label for="imgFile" class="custom-file-upload">Load Image File</label>
                        <input id ="imgFile" type="file" accept="image/png, image/jpeg">
                    </div>

                    <div class="button-container">
                        <button type="submit">Confirm</button>
                        <button type="button" type="reset" id="cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </dialog>

        
        <div class="book-container">
            <div>
                <ul>
                    <li><img src="booksImage\laCompagniaDell'anello.jpg" alt=""></li>
                    <li>Title <br><b>Il Signore degli Anelli: La Compagnia dell'Anello</b></li>
                    <li>Author <br><b>Tolkien</b></li>
                    <li>Price <br><b>39.40 Eur</b></li>
                    <li>Genre: <br><b>Fantasy</b></li>
                    <li><button>Remove</button></li>
                </ul>
            </div>
            
            
        
        
        </div>
        <div class="new-book"><button>New Book</button></div>
    </div>


    
    
</body>
</html>
